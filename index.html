<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ガソリンスタンド検索</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            font-size: 28px;
        }
        #address {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }
        .station {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .station h3 {
            margin-top: 0;
        }
        .price {
            margin-top: 10px;
        }
    </style>
    
</head>
<body>
    <h1>ガソリンスタンド検索</h1>
    <input type="text" id="address" placeholder="住所を入力してください">
    <button onclick="search()">検索</button>
    <div id="result"></div>
    <script>
        async function search() {
            const address = document.getElementById("address").value;
            const response = await fetch(
                "/search?address=" + encodeURIComponent(address)
            );
            const data = await response.json();
            const result = document.getElementById("result");
            result.innerHTML = "";
            if (data.message) {
                const p = document.createElement("p");
                p.textContent = data.message;
                result.appendChild(p);
                return;
            }
            for (const station of data) {
                const div = document.createElement("div");
                div.innerHTML =
                    "<h3>" + station.name + "</h3>" +
                    "<p>距離：" + station.distance + " m</p>" +
                    "<p>レギュラー：" +(station.regular ?? "情報なし") +" 円/L</p>" +
                    "<p>ハイオク：" +(station.high_octane ?? "情報なし") +" 円/L</p>" +
                    "<p>軽油：" +(station.diesel ?? "情報なし") +" 円/L</p>" +
                    "<hr>";
                result.appendChild(div);
            }
        }

    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>

</body>
</html>
